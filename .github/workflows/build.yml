name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The same pinned, checksum-verified public mods a contributor fetches.
      - name: Fetch dependencies
        run: python tools/bootstrap_dev_dependencies_r24.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run the checks
        run: ./gradlew build --no-daemon

      # Built from public sources only: fallback art, no private models or worlds.
      - uses: actions/upload-artifact@v4
        with:
          name: projectseele-jar
          path: build/libs/projectseele-*.jar
          if-no-files-found: error
