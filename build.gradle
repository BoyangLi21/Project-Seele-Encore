// Compile/prepare with ForgeGradle, then release the build JVM before playing.
// Export only explicitly changed environment values, not the user's full env.
['Client', 'Server'].each { side ->
    tasks.register("write${side}LaunchR17") {
        dependsOn 'classes', "prepareRun${side}"
        doLast {
            def launch = tasks.named("run${side}", JavaExec).get()
            // ForgeGradle's MinecraftRunTask resolves these inside exec(),
            // so merely reading JavaExec.commandLine returns only `java`.
            // Reuse the pinned plugin's token expansion without executing it.
            def run = launch.runConfig.get()
            def generator = net.minecraftforge.gradle.common.util.runs.RunConfigGenerator
            def generate = { String name, Object... values ->
                def method = generator.declaredMethods.find { it.name == name }
                if (method == null) throw new GradleException("ForgeGradle no longer exposes ${name}")
                method.accessible = true
                method.invoke(null, values)
            }
            def classes = generate('mapModClassesToGradle', project, run)
            def tokens = generate('configureTokensLazy', project, run, classes,
                launch.minecraftArtifacts, launch.runtimeClasspathArtifacts)
            launch.workingDir = file(run.workingDirectory)
            launch.workingDir.mkdirs()
            launch.args(generate('getArgsStream', run, tokens, false).toArray())
            run.jvmArgs.each { launch.jvmArgs(run.replace(tokens, it)) }
            if (run.client) launch.additionalClientArgs.get().each { launch.jvmArgs(run.replace(tokens, it)) }
            run.environment.each { key, value -> launch.environment(key, run.replace(tokens, value)) }
            run.properties.each { key, value -> launch.systemProperty(key, run.replace(tokens, value)) }
            run.allSources.each { launch.classpath(it.runtimeClasspath) }
            def inherited = System.getenv()
            def env = launch.environment.findAll { key, value -> value.toString() != inherited.get(key) }
            def jvm = generate('getJvmArgsStream', run,
                run.client ? launch.additionalClientArgs.get() : [], tokens).toArray().toList()
            if (!jvm.any { it.startsWith('-Xmx') }) throw new GradleException('Missing configured heap in exported JVM arguments')
            def command = [launch.javaLauncher.get().executablePath.asFile.absolutePath] + jvm + ['-Dfile.encoding=UTF-8'] +
                ['-cp', launch.classpath.asPath, run.main] + launch.args
            if (!run.main || launch.classpath.empty) throw new GradleException('Incomplete ForgeGradle launch configuration')
            def target = file(".Codex/${side.toLowerCase()}-launch-r17.json")
            target.parentFile.mkdirs()
            target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                command: command.collect { it.toString() },
                environment: env.collectEntries { key, value -> [(key): value.toString()] },
                workingDirectory: launch.workingDir.absolutePath
            ])), 'UTF-8')
            logger.lifecycle("Prepared ${side.toLowerCase()} launch: ${target}")
        }
    }
}

// Explicit frozen delivery assets only. No implicit private-pack replacement.
tasks.named('processResources').configure {
    if (project.hasProperty('r45FinalAssets')) {
        def overlay = file(project.property('r45FinalAssets'))
        def receipt = new File(overlay, 'ASSET_FROZEN.json')
        inputs.file(receipt)
        inputs.dir(overlay)
        doLast {
            def manifest = new groovy.json.JsonSlurper().parse(receipt)
            if (manifest.schema != 'projectseele.final-assets-frozen.r45.v1') {
                throw new GradleException('Explicit R45 frozen asset receipt required')
            }
            manifest.files.each { name, expected ->
                if (!(name.startsWith('assets/') || name.startsWith('data/')) || name.contains('..') || name.contains('\\') || name.contains(':')) {
                    throw new GradleException('Unsafe frozen asset path: ' + name)
                }
                def input = new File(overlay, name)
                def actual = java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString()
                if (actual != expected) throw new GradleException('Frozen selected asset changed: ' + name)
                def target = new File(destinationDir, name)
                target.parentFile.mkdirs()
                java.nio.file.Files.copy(input.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
    if (project.hasProperty('r47FinalAssets')) {
        if (project.hasProperty('r45FinalAssets')) {
            throw new GradleException('Select one release asset overlay')
        }
        def overlay = file(project.property('r47FinalAssets'))
        inputs.dir(overlay)
        doLast {
            if (!new File(overlay, 'assets/projectseele/sounds.json').isFile() ||
                !new File(overlay, 'data/projectseele/dimension_type/geofront.json').isFile()) {
                throw new GradleException('Complete selected R47 asset overlay required')
            }
            copy {
                from overlay
                into destinationDir
                // Registration metadata must remain the processed current
                // source, never a template or an older private snapshot.
                include 'assets/**', 'data/**', 'META-INF/licenses/**'
            }
        }
    }
}
