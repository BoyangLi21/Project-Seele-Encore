buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'projectseele.refmap.json'
    config 'projectseele.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
jarJar.enable()
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Dev-only: GeckoLib's mixin refmap stores SRG names while this
            // environment runs official mappings; remap it at launch or its
            // injections fail (run `gradlew createSrgToMcp` once).
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            arg '-mixin.config=projectseele.mixins.json'

            // Registry DEBUG output is hundreds of thousands of synchronous
            // console writes in userdev and stalls the integrated server.
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            // Visual-debug convenience: `gradlew runClient -PquickPlayWorld=<folder>`
            // bypasses menus without affecting ordinary launches.
            if (project.hasProperty('quickPlayWorld')) {
                args '--quickPlaySingleplayer', project.property('quickPlayWorld')
            }
            // Development-only visual regression: build the fixed lab and
            // capture all approved Unit-01 keyframes without keyboard input.
            if (project.hasProperty('visualCapture')) {
                property 'projectseele.visualCapture', 'true'
            }
            if (project.hasProperty('foundationVideoCapture')) {
                property 'projectseele.visualCapture', 'true'
                property 'projectseele.foundationVideoCapture', 'true'
                property 'projectseele.manifoldInnerAuditOnly', 'true'
            }
            if (project.hasProperty('strictHighDetail')) {
                property 'projectseele.strictHighDetail', 'true'
                args '--width', '1280', '--height', '720'
            }
            if (project.hasProperty('poseCaptureSmoke')) {
                property 'projectseele.poseCaptureSmoke', 'true'
            }
            if (project.hasProperty('connectedActionReview')) {
                property 'projectseele.connectedActionReview', 'true'
            }
            if (project.hasProperty('rifleActionReview')) {
                property 'projectseele.connectedActionReview', 'true'
                property 'projectseele.rifleActionReview', 'true'
            }
            if (project.hasProperty('motionReviewR05')) {
                property 'projectseele.connectedActionReview', 'true'
                property 'projectseele.rifleActionReview', 'true'
                property 'projectseele.motionReviewR05', 'true'
                if (project.hasProperty('motionReviewR05All')) property 'projectseele.motionReviewR05All', 'true'
            }
            if (project.hasProperty('feedReviewR06')) {
                property 'projectseele.feedReviewR06', 'true'
            }
            if (project.hasProperty('motionReviewR06')) {
                property 'projectseele.connectedActionReview', 'true'
                property 'projectseele.rifleActionReview', 'true'
                property 'projectseele.motionReviewR05', 'true'
                property 'projectseele.motionReviewR06', 'true'
                if (project.hasProperty('motionReviewR05All')) property 'projectseele.motionReviewR05All', 'true'
            }
            if (project.hasProperty('pyramidInteriorReview')) {
                property 'projectseele.pyramidInteriorReview', 'true'
            }
            if (project.hasProperty('commandLiftReview')) {
                property 'projectseele.commandLiftReview', 'true'
            }
            if (project.hasProperty('tvWorldPreviewReview')) {
                property 'projectseele.tvWorldPreviewReview', project.property('tvWorldPreviewReview')
            }
            if (project.hasProperty('regionalBuild')) {
                property 'projectseele.regionalBuild', project.property('regionalBuild')
            }
            if (project.hasProperty('firstBattleReviewClip')) {
                property 'projectseele.firstBattleReviewClip', project.file(project.property('firstBattleReviewClip')).absolutePath
            }
            if (project.hasProperty('firstBattleMovieOnly')) {
                property 'projectseele.firstBattleMovieOnly', 'true'
            }
            if (project.hasProperty('farViewOnly')) {
                property 'projectseele.farViewOnly', project.property('farViewOnly')
            }
            if (project.hasProperty('tvFacilityProfile')) {
                jvmArgs '-XX:StartFlightRecording=filename=D:/eva/artifacts/tv_facilities_r16/native_profile.jfr,settings=profile,dumponexit=true,maxsize=128m'
            }
            if (project.hasProperty('tvTransitCapture')) {
                property 'projectseele.tvTransitCapture', 'true'
            }
            if (project.hasProperty('tvExteriorService')) {
                property 'projectseele.exteriorService', project.property('tvExteriorService')
            }
            if (project.hasProperty('nativeCapture')) {
                property 'projectseele.nativeCapture', 'true'
            }
            if (project.hasProperty('tvNpcCapture')) {
                property 'projectseele.tvNpcCapture', 'true'
            }
            if (project.hasProperty('photoRenderDistance')) {
                property 'projectseele.photoRenderDistance', project.property('photoRenderDistance')
            }
            if (project.hasProperty('liftReturnY')) {
                property 'projectseele.liftReturnY', project.property('liftReturnY')
            }
            if (project.hasProperty('staffPhotoOnly')) {
                property 'projectseele.staffPhotoOnly', 'true'
            }
            if (project.hasProperty('skinnedProxyPreview')) {
                property 'projectseele.skinnedProxyPreview', 'true'
            }
            if (project.hasProperty('manifoldInnerPreview')) {
                property 'projectseele.manifoldInnerPreview', 'true'
            }
            // The 784-block-tall connected Tokyo-3 / GeoFront dimension
            // contains roughly twice vanilla's section count. Both manual
            // high-detail play and fresh-map capture need more than the
            // ergonomic 4G default while the 512-block sphere is resident.
            // The connected rescue world is tall even during ordinary manual
            // play. Keep the user's requested 6G heap on every client launch;
            // restricting it to capture-only runs silently left the desktop
            // test BAT at 4G and allowed the light engine to exhaust the heap.
            def clientMaxHeap = (project.findProperty('clientHeap') ?: (project.hasProperty('lowEndClient') ? '4G' : '6G')).toString()
            if (!(clientMaxHeap ==~ /[1-9][0-9]*[mMgG]/)) throw new GradleException('clientHeap must be a positive JVM memory size, such as 4G')
            jvmArgs project.hasProperty('clientHeap') || project.hasProperty('lowEndClient') ? '-Xms1G' : '-Xms2G',
                    '-Xmx' + clientMaxHeap, '-XX:+UseG1GC',
                    '-XX:MaxGCPauseMillis=80'
            if (project.hasProperty('visualCapturePose')) {
                property 'projectseele.visualCapturePose', project.property('visualCapturePose')
            }
            if (project.hasProperty('visualCaptureUnit')) {
                property 'projectseele.visualCaptureUnit', project.property('visualCaptureUnit')
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            if (project.hasProperty('tvWorldPreviewReview')) {
                workingDirectory project.file('.Codex/tv-world-preview/server')
                property 'projectseele.tvWorldPreviewReview', project.property('tvWorldPreviewReview')
                args '--universe', project.file('run/saves').absolutePath,
                        '--world', 'SEELE_TV_WORLD_PREVIEW_20260906'
            }
            if (project.hasProperty('regionalBuild')) {
                workingDirectory project.file(project.findProperty('reviewServerDirectory') ?: '.Codex/world-expansion/server')
                property 'projectseele.regionalBuild', project.property('regionalBuild')
                args '--universe', project.file('run/saves').absolutePath,
                        '--world', project.findProperty('reviewServerWorld') ?: 'SEELE_TV_WORLD_PREVIEW_20260906'
            }
            // The private 1-3 player SEELE test server keeps the tall
            // connected dimension and its active EVA/Angel simulation away
            // from the rendering client. Eight gigabytes leaves headroom for
            // the enlarged Tokyo-3 and GeoFront chunk sets.
            jvmArgs (project.hasProperty('tvWorldPreviewReview') || project.hasProperty('regionalBuild')) ? '-Xms1G' : '-Xms2G',
                    (project.hasProperty('tvWorldPreviewReview') || project.hasProperty('regionalBuild')) ? '-Xmx4G' : '-Xmx8G', '-XX:+UseG1GC',
                    '-XX:MaxGCPauseMillis=100'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
// Delivery snapshots keep private high-detail assets separate from the source
// checkout while compiling the same runtime and all newly authored resources.
if (project.hasProperty('seeleResourceSnapshot')) {
    def seeleSnapshot = file(project.property('seeleResourceSnapshot'))
    if (!seeleSnapshot.isDirectory()) throw new GradleException('SEELE resource snapshot does not exist')
    sourceSets.main.resources.setSrcDirs([seeleSnapshot])
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // GeckoLib (animated entity models)
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
        }
    }

    // Local-only evaluation mods are copied here by tools/start_test.bat.
    // flatDir gives ForgeGradle coordinates so fg.deobf can remap their
    // production SRG/refmap names for the official-mappings dev runtime.
    flatDir {
        dirs '.Codex/local-mods', '.Codex/local-mods-optional'
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // GeckoLib: animated entity pipeline (EVA units and humanoid Angels)
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    if (file('.Codex/local-mods/create-1.20.1-6.0.8-slim.jar').exists()) {
        runtimeOnly fg.deobf('local:create:1.20.1-6.0.8:slim')
        runtimeOnly fg.deobf('local:flywheel-forge-1.20.1:1.0.5')
        runtimeOnly fg.deobf('local:Ponder-Forge-1.20.1:1.0.91')
        runtimeOnly fg.deobf('local:Registrate:MC1.20-1.3.3')
    }

    // Cross-platform articulated body dynamics; no native DLL or second engine process.
    minecraftLibrary('com.github.stephengold:jbullet:1.0.3') { transitive = false }
    minecraftLibrary('com.github.stephengold:stack-alloc:1.0.2') { transitive = false }
    minecraftLibrary('javax.vecmath:vecmath:1.5.2') { transitive = false }
    jarJar(group: 'com.github.stephengold', name: 'jbullet', version: '1.0.3') {
        jarJar.ranged(it, '[1.0.3,1.0.4)')
        transitive = false
    }
    jarJar(group: 'com.github.stephengold', name: 'stack-alloc', version: '1.0.2') {
        jarJar.ranged(it, '[1.0.2,1.0.3)')
        transitive = false
    }
    jarJar(group: 'javax.vecmath', name: 'vecmath', version: '1.5.2') {
        jarJar.ranged(it, '[1.5.2,1.5.3)')
        transitive = false
    }

    def localArs = file('.Codex/local-mods/ars-nouveau-4.12.7.jar')
    def localCurios = file('.Codex/local-mods/curios-forge-1.20.1-5.14.1.jar')
    def localAnotherFurniture = file('.Codex/local-mods/another-furniture-1.20.1-3.0.4.jar')
    def localMovingElevators = file('.Codex/local-mods/movingelevators-1.4.12-forge-mc1.20.1.jar')
    def localMovingElevatorsConfig = file('.Codex/local-mods/supermartijn642configlib-1.1.8-forge-mc1.20.jar')
    def localMovingElevatorsCore = file('.Codex/local-mods/supermartijn642corelib-1.1.24-forge-mc1.20.1.jar')
    def localMtr = file('.Codex/local-mods/MTR-forge-4.0.5+1.20.1.jar')
    def localSbw = file('.Codex/local-mods/superbwarfare-0.8.9.1-hotfix-mc1.20.1-993063bed-all.jar')
    def localKff = file('.Codex/local-mods/kotlinforforge-4.12.0-all.jar')
    if (file('.Codex/local-mods/grandpianomod-1.0.0.jar').exists()) {
        runtimeOnly fg.deobf('local:grandpianomod:1.0.0')
    }
    if (file('.Codex/local-mods/mcw-doors-1.1.5-mc1.20.1forge.jar').exists()) {
        runtimeOnly fg.deobf('local:mcw-doors:1.1.5-mc1.20.1forge')
    }
    if (localSbw.exists() && localKff.exists()) {
        runtimeOnly fg.deobf('local:superbwarfare:0.8.9.1-hotfix-mc1.20.1-993063bed:all')
        runtimeOnly fg.deobf('local:kotlinforforge:4.12.0:all')
    }
    if (file('.Codex/local-mods/Patchouli-1.20.1-85-FORGE.jar').exists()) {
        runtimeOnly fg.deobf('local:Patchouli:1.20.1-85-FORGE')
    }
    def localFarsight = file('.Codex/local-mods/farsight-1.20.1-5.1.jar')
    def localCupboard = file('.Codex/local-mods/cupboard-1.20.1-3.9.jar')
    if (localCurios.exists()) {
        runtimeOnly fg.deobf('local:curios-forge-1.20.1:5.14.1')
    }
    if (localArs.exists()) {
        runtimeOnly fg.deobf('local:ars-nouveau:4.12.7')
    }
    if (localAnotherFurniture.exists()) {
        runtimeOnly fg.deobf('local:another-furniture-1.20.1:3.0.4')
    }
    if (localMovingElevators.exists()
            && localMovingElevatorsConfig.exists()
            && localMovingElevatorsCore.exists()) {
        implementation fg.deobf('local:movingelevators:1.4.12-forge-mc1.20.1')
        implementation fg.deobf('local:supermartijn642configlib:1.1.8-forge-mc1.20')
        implementation fg.deobf('local:supermartijn642corelib:1.1.24-forge-mc1.20.1')
    }
    if (localMtr.exists()) {
        runtimeOnly fg.deobf('local:MTR-forge:4.0.5+1.20.1')
    }
    // Client-only retained-chunk renderer. It is intentionally absent from
    // server packs and avoids LOD artefacts in the deep GeoFront dimension.
    if (project.hasProperty('retainedChunks') && !project.hasProperty('distantHorizons') && !project.hasProperty('nativeCapture') && localFarsight.exists() && localCupboard.exists()) {
        runtimeOnly fg.deobf('local:cupboard:1.20.1-3.9')
        runtimeOnly fg.deobf('local:farsight:1.20.1-5.1')
    }
    // Opt-in until the selected world's fresh cave-aware LOD cache is verified.
    if (project.hasProperty('distantHorizons')) {
        runtimeOnly fg.deobf('local:DistantHorizons:3.2.0-b-1.20.1-fabric-forge')
    }
    if (project.hasProperty('clientNavigation')) {
        runtimeOnly fg.deobf('local:xaerominimap-forge:1.20.1-26.5.0')
        runtimeOnly fg.deobf('local:xaeroworldmap-forge:1.20.1-1.46.0')
    }
    if (project.hasProperty('lowEndClient') || project.hasProperty('optimizedClient')) {
        runtimeOnly fg.deobf('local:embeddium:0.3.31+mc1.20.1')
    }
    if (project.hasProperty('cityShaders')) {
        runtimeOnly fg.deobf('local:oculus:mc1.20.1-1.8.0')
    }
    if (project.hasProperty('clientOcclusion')) {
        runtimeOnly fg.deobf('local:entityculling-forge:1.7.3-mc1.20.1')
    }
    if (project.hasProperty('gpuTerrain')) {
        runtimeOnly fg.deobf('local:acedium:0.2.7-beta')
    }
    if (project.hasProperty('lowEndClient') || project.hasProperty('optimizedClient') || project.hasProperty('optimizedServer') || project.hasProperty('distantHorizons')) {
        runtimeOnly fg.deobf('local:ferritecore:6.0.1-forge')
        runtimeOnly fg.deobf('local:modernfix-forge:5.27.83+mc1.20.1')
    }
    // Mixin annotation processor: generates our refmap at compile time.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    manifest.from tasks.named('jar').get().manifest
    finalizedBy 'reobfJarJar'
}
tasks.named('assemble').configure { dependsOn 'jarJar' }

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('verifyEvaPoseTransition', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.projectseele.client.render.EvaPoseTransitionTest'
}
tasks.register('verifyLaunchMotionR29', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.projectseele.world.LaunchMotionR29Test'
}
tasks.named('check').configure {
    dependsOn 'verifyEvaPoseTransition'
    dependsOn 'verifyLaunchMotionR29'
}

tasks.register('verifyEvaVideoCodec', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.projectseele.network.EvaVideoCodecTest'
    systemProperty 'java.awt.headless', 'true'
}
tasks.named('check').configure {
    dependsOn 'verifyEvaVideoCodec'
}

tasks.register('verifyBiomeCornerCache', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.projectseele.util.BiomeCornerCacheTest'
    workingDir = file('.Codex/biome-cache-test')
    doFirst { workingDir.mkdirs() }
}
tasks.named('check').configure { dependsOn 'verifyBiomeCornerCache' }

tasks.register('verifyBiomeCornerMainThreadR51', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.projectseele.util.BiomeCornerMainThreadR51Test'
    workingDir = file('.Codex/biome-corner-main-thread-r51-test')
    doFirst { workingDir.mkdirs() }
}
tasks.named('check').configure { dependsOn 'verifyBiomeCornerMainThreadR51' }

tasks.register('verifyCombatMotionR29', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
